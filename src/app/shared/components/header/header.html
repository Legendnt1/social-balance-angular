<header class="fixed left-0 top-0 z-50 w-full bg-primary-dark">
  <nav class="mx-auto max-w-[1200px] px-8">
    <div class="my-2 flex h-20 items-center justify-between">
      <!-- Logo -->
      <a routerLink="/" class="inline-flex items-center gap-2">
        <img
          src="assets/images/core/favicon.ico"
          alt="Logo de Social Balance"
          class="h-12 w-auto rounded-md"
        />
      </a>

      <!-- Hamburguesa (responsive movil) -->
      <button
        type="button"
        class="relative z-[60] flex flex-col gap-1.5 md:hidden cursor-pointer"
        (click)="toggleMenu()"
        aria-label="Abrir menú"
        [attr.aria-expanded]="menuOpen()"
      >
        <span class="block h-[3px] w-6 rounded bg-white"></span>
        <span class="block h-[3px] w-6 rounded bg-white"></span>
        <span class="block h-[3px] w-6 rounded bg-white"></span>
      </button>

      <!-- Navegación desktop-->
      <header-desktop [headerMenus]="headerMenus" />

      <div class="hidden md:block">
        <a
          routerLink="/register"
          class="inline-flex items-center rounded-lg border-2 border-black bg-white px-4 py-2 font-semibold text-black transition-colors hover:bg-black hover:text-white"
        >
          Registro
        </a>
      </div>
    </div>

    <!-- Panel móvil -->
    @if (menuOpen()) {
      <header-mobile [headerMenus]="headerMenus" />
    }
  </nav>
</header>
