<div class="border-t border-white/10 md:hidden">
  <ul class="flex flex-col gap-1 p-4">
    @for (menu of headerMenus(); track menu.page) {
    <li>
      @if (menu.links.length) {
      <button
        type="button"
        class="flex w-full items-center justify-between px-2 py-2 text-left font-semibold text-white"
        (click)="toggleDropdown(menu.page)"
      >
        {{ menu.page }}
        <svg
          class="h-4 w-4 transition-transform"
          [class.rotate-180]="openDropdown() === menu.page"
          viewBox="0 0 20 20"
          fill="currentColor"
          aria-hidden="true"
        >
          <path
            fill-rule="evenodd"
            d="M5.23 7.21a.75.75 0 011.06.02L10 10.94l3.71-3.71a.75.75 0 111.06 1.06l-4.24 4.24a.75.75 0 01-1.06 0L5.21 8.29a.75.75 0 01.02-1.08z"
            clip-rule="evenodd"
          />
        </svg>
      </button>
      @if(openDropdown() === menu.page) {
      <ul class="mt-1 space-y-1 rounded-md bg-primary-dark/90 p-1">
        @for (link of menu.links; track link.href) {
        <li>
          <a
            class="block rounded-md px-4 py-2 text-sm text-white transition-colors hover:text-primary-light"
            [routerLink]="menu.router"
            (click)="closeAll()"
          >
            {{ link.label }}
          </a>
        </li>
        }
      </ul>
      } } @else {
      <a
        class="block px-2 py-2 font-semibold text-white"
        [routerLink]="menu.router"
        (click)="closeAll()"
      >
        {{menu.page}}
      </a>
      }
    </li>
    }

    <li class="pt-2">
      <a
        routerLink="/register"
        class="inline-flex items-center rounded-lg border-2 border-black bg-white px-4 py-2 font-semibold text-black transition-colors hover:bg-black hover:text-white"
      >
        Registro
      </a>
    </li>
  </ul>
</div>
